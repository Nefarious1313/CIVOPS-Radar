plugins {
    id 'com.android.application'
}

android {
    namespace 'io.synthetic.civopsradar'
    compileSdk 34

    defaultConfig {
        applicationId "io.synthetic.civopsradar"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}

configurations.all {
    // kotlin-stdlib 1.8+ bundles the jdk7/jdk8 extension classes, but
    // kotlinx-coroutines 1.6.1 (via androidx.lifecycle) still pulls the old
    // split artifacts, which duplicate those classes on the classpath.
    // Drop the stale split artifacts so only kotlin-stdlib:1.8.22 remains.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
